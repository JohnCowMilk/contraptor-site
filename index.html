<head>

<title>Contraptor</title>

  .card {

  .card:hover { background: #1e1e28; }
  .card b { display: block; font-size: 18px; }
  .card span { color: #a9a9b8; font-size: 15px; }

  <div class="wrap">
    <h1>Cont<span class="accent">raptor</span></h1>
