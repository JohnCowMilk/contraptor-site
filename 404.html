<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contraptor</title>
<!-- Smart App Banner: Safari on iOS shows an "Open / View" strip for the app. -->
<meta name="apple-itunes-app" content="app-id=6772646468">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0b0b0f; color: #e9e9ef;
         font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 56px 22px 64px; text-align: center; }
  h1 { font-size: 40px; margin: 0 0 6px; letter-spacing: 0.5px; }
  .tag { color: #a9a9b8; margin: 0 0 28px; }
  p { margin: 0 0 20px; }
  a.btn { display: inline-block; background: #8f86ff; color: #0b0b0f; font-weight: 700;
          padding: 14px 26px; border-radius: 14px; text-decoration: none; }
  .small { color: #a9a9b8; font-size: 14px; margin-top: 28px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Contraptor</h1>
  <p class="tag">Build it. Solve it. Share it.</p>
  <p>Someone shared a Contraptor Challenge or Solution with you. Open it in the app.</p>
  <p><a class="btn" href="https://apps.apple.com/us/app/contraptor/id6772646468">Get Contraptor on the App Store</a></p>
  <p class="small">Already have the app? Tap the link again and it opens right to the item.</p>
</div>
</body>
</html>
